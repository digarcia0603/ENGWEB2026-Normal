services:
  mongo:
    image: mongo:7
    container_name: engweb_ex2_mongo
    volumes:
      - mongo_ex2_data:/data/db
    networks:
      - ex2-net

  api:
    restart: unless-stopped
    build: ./api
    container_name: engweb_ex2_api
    ports:
      - "19020:19020"
    environment:
      - PORT=19020
      - MONGO_URL=mongodb://mongo:27017/leituras
    depends_on:
      - mongo
    networks:
      - ex2-net

  web:
    image: nginx:alpine
    container_name: engweb_ex2_nginx
    ports:
      - "19021:80"
    volumes:
      - ./nginx/index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - ex2-net

networks:
  ex2-net:
    driver: bridge

volumes:
  mongo_ex2_data:
